name: Gerar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Preparar APK
        run: cp app/build/outputs/apk/release/app-release.apk PainelOBD.apk

      - name: Publicar versão
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Painel OBD 1.0.${{ github.run_number }}
          make_latest: true
          files: PainelOBD.apk
          body: |
            Baixe o arquivo **PainelOBD.apk** abaixo pelo celular e instale.
            Link direto da versão mais nova: https://github.com/${{ github.repository }}/releases/latest/download/PainelOBD.apk
